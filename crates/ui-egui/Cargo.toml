[package]
name = "wordcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WordCraft egui front end (Word-style ribbon UI); swappable: nothing below depends on it"

[lints]
workspace = true

# embed: the ArtCraft community links and About wording (docs/brand/LICENSE-brand.txt). The embed
# build, a modified version, turns it off; everything else keeps the default.
[features]
default = ["brand"]
brand = []

[dependencies]
wordcraft-geom = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-engine = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
unicode-normalization = { workspace = true }
aho-corasick = { workspace = true } # embed: host marks

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
