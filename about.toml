# cargo-about policy for the third-party licence notices shipped with the embed build
# (packaging/embed/package.sh -> THIRD-PARTY-LICENSES.txt). Build-time tool only; it is not a
# dependency. `accepted` is the fork's licence policy for what the module may contain (permissive
# licences only, as ATTRIBUTION.md and NOTICE say); there is no cargo-deny configuration to mirror.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
]

# Only the code that is compiled into the module: no build scripts, no tests.
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["wasm32-unknown-unknown"]

# egui's default UI fonts (Ubuntu-Light, Hack, emoji-icon-font, Noto Emoji): the crate is
# MIT/Apache-2.0 code plus font licences. The font licence texts the crate ships are also copied
# into licenses/ by package.sh.
[epaint_default_fonts]
accepted = ["OFL-1.1", "Ubuntu-font-1.0"]

# Crates whose package has no licence file, or only a template or a combined one: the licence
# file is clarified so its real copyright holder line is shown (checksums pin the exact text; a
# release that changes it fails the package until this section is reviewed). 'git' files come
# from the upstream repository at the commit each package was published from (.cargo_vcs_info.json);
# the WordCraft crates point at this workspace's LICENSE-MIT.
# upstream licence files (checked out at the commit each package was published from)
[egui.clarify]
license = "MIT OR Apache-2.0"
[[egui.clarify.git]]
path = "LICENSE-MIT"
checksum = "95ca92f5f8ea5231f1580b3a2a799e8260af3114b900e1def5355a7f44bcf60c"
license = "MIT"

